<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Trucking Pros Financial</title>
    <script>
      // Select only the initial paint, never authentication or route access.
      (function () {
        var loginEntry = location.pathname === "/login";
        if (location.pathname === "/") {
          try {
            loginEntry = localStorage.getItem("isAuthenticated") !== "true" || !localStorage.getItem("user");
          } catch (_) { loginEntry = true; }
        }
        if (!loginEntry) return;
        document.documentElement.dataset.loginEntry = "";
        var image = document.createElement("link");
        image.rel = "preload";
        image.as = "image";
        image.href = "/assets/tpf-building-refined.jpg";
        image.fetchPriority = "high";
        document.head.appendChild(image);
      })();
    </script>
    <style>
      /* Preserve the anonymous-entry scene preload while the independent startup mark paints. */
      html[data-login-entry] body { margin: 0; background: #243d4b; }
      .ff-startup-splash {
        position: fixed; z-index: 9999; inset: 0; display: grid; place-items: center;
        background: #243d4b; color: #eef6f8;
      }
      .ff-startup-splash__content { display: flex; flex-direction: column; align-items: center; gap: 13px; }
      .ff-startup-splash__mark { display: block; width: 72px; height: 66px; object-fit: contain; }
      .ff-startup-splash__wordmark {
        color: #eef6f8; font-family: "DM Sans", "Segoe UI", sans-serif;
        font-size: 17px; font-weight: 700; letter-spacing: 0.08em;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" />
    <link rel="icon" type="image/png" href="/images/tpf-logo.png" />
  </head>
  <body>
    <div id="root">
      <div class="ff-startup-splash" role="status" aria-label="Loading FactorFlux">
        <div class="ff-startup-splash__content">
          <svg class="ff-startup-splash__mark" data-ff-startup-mark viewBox="0 0 578.85 527.45" aria-hidden="true" focusable="false">
            <polygon points="315.13 209.18 422.86 316.92 476.05 263.73 315.13 102.8 315.13 0 553.15 238.02 578.85 263.73 553.15 289.43 474.26 368.32 474.27 368.32 448.56 394.02 315.13 527.45 315.13 424.65 371.46 368.32 315.13 311.99 315.13 209.18 315.13 209.18" fill="rgb(9, 139, 159)" />
            <polygon points="155.99 316.92 263.72 209.19 263.72 311.99 207.4 368.32 263.72 424.64 263.72 527.45 25.7 289.43 0 263.73 25.7 238.02 263.72 0 263.72 102.81 102.8 263.73 155.99 316.92 155.99 316.92" fill="rgb(39, 170, 184)" />
          </svg>
          <span class="ff-startup-splash__wordmark">FactorFlux</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
